name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # The terminal client keeps its device key in the OS keychain; on Linux
      # that is the Secret Service, which a runner does not have running.
      - run: sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring libsecret-tools dbus
      # A test that hangs fails with its own name instead of holding the job.
      - run: >-
          dbus-run-session -- sh -c
          'printf "\n" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
          && node --test --test-concurrency=2 --test-timeout=120000'

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest

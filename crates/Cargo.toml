[workspace]
resolver = "3"
members = ["tailchat-core", "tailchat-store", "tailchat-net", "tailchat-node", "tailchat-crypto", "tailchat-web", "tcc"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
as_conversions = "deny"

[profile.release]
lto = true
codegen-units = 1
overflow-checks = true

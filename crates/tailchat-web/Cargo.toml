[package]
name = "tailchat-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tailchat-core = { path = "../tailchat-core" }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's crypto.getRandomValues for vodozemac, aes-gcm and argon2.
getrandom = { version = "0.4", features = ["wasm_js"] }
# The executor, the notices and their JSON: the native driver's own, without
# its thread, tokio, rustls or SQLCipher.
tailchat-net = { path = "../tailchat-net", default-features = false }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
zeroize = "1"

[dev-dependencies]
zeroize = "1"

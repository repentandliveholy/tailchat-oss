[package]
name = "tailchat-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tailchat-core = { path = "../tailchat-core" }
# SQLCipher built from source: CommonCrypto on Apple, the system OpenSSL
# (libcrypto) elsewhere. Never plain SQLite: `open` refuses a build without it.
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

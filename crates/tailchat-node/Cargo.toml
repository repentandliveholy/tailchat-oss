[package]
name = "tailchat-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"


[dependencies]
napi = { version = "3", features = ["napi6", "serde-json"] }
napi-derive = "3"
serde_json = "1"
tailchat-core = { path = "../tailchat-core" }
tailchat-net = { path = "../tailchat-net" }
tailchat-store = { path = "../tailchat-store" }

[package]
name = "tailchat-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Olm/Megolm. No primitive of our own (docs/specs/2026-11-04-e2ee.md §1.1);
# no vodozemac type leaves this crate (§6). Without `libolm-compat`: there
# are no libolm pickles to read.
vodozemac = { version = "=0.11.1", default-features = false, features = ["precomputed-tables"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "getrandom", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1", features = ["serde"] }

[package]
name = "tcc"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A minimal terminal client for Tailchat cloud"

[lints]
workspace = true

[[bin]]
name = "tcc"
path = "src/main.rs"

[dependencies]
# One current-thread runtime: the socket, the keyboard and the timers share one task.
tokio = { version = "1", default-features = false, features = ["rt", "time", "net", "io-util", "macros", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde_json = "1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2"
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
